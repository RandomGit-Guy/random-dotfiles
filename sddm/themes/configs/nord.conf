[General]
scale = 1.0
enable-animations = true
background-fill-mode = fill


## Lock-screen ##

[LockScreen]
display = true
padding-top = 200 
padding-bottom = 50 

background = "../backgrounds/nord.jpg"
blur = 0 

[LockScreen.Clock]
display = true
position = top-center
align = center
format: hh:mm

font-family = "IBM Plex Sans Bold"
font-size = 70
color = "#2e3440"

[LockScreen.Date]
display = false

[LockScreen.Message]
display = false


## Login-screen ##

### Login area ###

[LoginScreen]
# background = "../backgrounds/nord.jpg"
use-background-color = true
background-color = "#2e3440"
blur = 40 

[LoginScreen.LoginArea]
position = center
margin = -1

[LoginScreen.LoginArea.Avatar]
always-active = true
shape = circle 

active-size = 100

inactive-size = 60
inactive-border-size = 2
inactive-border-color = "#4c566a"
inactive-opacity = 0.35

[LoginScreen.LoginArea.Username]
margin = 35

font-family = "IBM Plex Sans Regular"
font-size = 30
color = "#eceff4"

[LoginScreen.LoginArea.PasswordInput]
display-icon = false
margin-top = 70 

background-opacity = 1 
background-color = "#3b4252"
border-size = 0
border-radius-left = 10
border-radius-right = 10

width = 225 
height = 40 

font-family = "IBM Plex Sans Regular"
font-size = 12
content-color = "#eceff4"
active-content-color = "#d8dee9"

[LoginScreen.LoginArea.LoginButton]
margin-left = 5 

background-opacity = 1
background-color = "#3b4252"
active-background-opacity = 1
active-background-color = "#4c566a"
border-size = 0
border-radius-left = 10
border-radius-right = 10

font-family = "IBM Plex Sans Regular"
font-size = 12

[LoginScreen.LoginArea.Spinner]
display-text = false

font-family = "IBM Plex Sans Regular"
font-size = 12

icon-size = 40

[LoginScreen.LoginArea.WarningMessage]
margin-top = 5

normal-color = "#ebcb8b"
warning-color = "#ebcb8b"
error-color = "#bf616a"

font-family = "IBM Plex Sans Regular"
font-size = 12

### Menu area ###

[LoginScreen.MenuArea.Buttons]
margin-bottom = 460
spacing = 20
size = 30

font-family = "IBM Plex Sans Regular"

[LoginScreen.MenuArea.Popups]
max-height = 500
item-height = 40
margin = 10

border-size = 2
border-color = "#4c566a"

font-family = "IBM Plex Sans Regular"
content-color = "#eceff4"
active-content-color = "#d8dee9"
font-size = 12
icon-size = 16

background-opacity = 1
background-color = "#3b4252"

active-option-background-opacity = 1
active-option-background-color = "#4c566a"

[LoginScreen.MenuArea.Session]
display = true
display-session-name = false

position = bottom-center 
popup-direction = up
popup-align = center

content-color = "#eceff4"
active-content-color = "#d8dee9"

[LoginScreen.MenuArea.Layout]
display = true

position = bottom-center
popup-direction = up
popup-align = center

content-color = "#eceff4"
active-content-color = "#d8dee9"

[LoginScreen.MenuArea.Keyboard]
display = true

position = bottom-center
popup-direction = up
popup-align = center

content-color = "#eceff4"
active-content-color = "#d8dee9"

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = login
start-hidden = true

background-opacity = 1
background-color = "#3b4252"

key-content-color = "#eceff4"
selection-content-color = "#81a1c1"
selection-background-color = "#3b4252"
primary-color = "#88c0d0"

[LoginScreen.MenuArea.Power]
display = true

position = bottom-center
popup-direction = up
popup-align = center
popup-width = 110

content-color = "#eceff4"
active-content-color = "#d8dee9"

[Tooltips]
enable = false

[User.randomguy]
preferred-session = "Hyprland"

