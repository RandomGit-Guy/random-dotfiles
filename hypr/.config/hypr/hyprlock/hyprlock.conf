$bg_path = ~/.config/hypr/background.jpg
$font = "IBM Plex Sans"
$font_nf = "JetBrainsMono Nerd Font Propo"

$background = rgba(46, 52, 64, 1)
$background_alt = rgba(59, 66, 82, 1)
$foreground = rgba(76, 86, 106, 1)
$text = rgba(236, 239, 244, 1)
$accent = rgba(136, 192, 208, 1)
$green = rgba(163, 190, 140, 1)
$yellow = rgba(235, 203, 139, 1)
$red = rgba(191, 97, 106, 1)

background {
  color = $background
}


## Inputs ##

input-field {
  size = 250, 50 
  position = 0, -75 
  halign = center
  valign = center
  outline_thickness = 0
  inner_color = $background_alt
  dots_size = 0.2 # 0.2 - 0.8
  dots_spacing = 0.4 # 0.0 - 1.0
  dots_center = true

  fade_on_empty = false
  placeholder_text = Enter password

  font_color = $text
  font_family = "IBM Plex Sans" Semibold

  check_color = $yellow
  check_text = Please wait

  fail_color = $red
  fail_text = Try again

  capslock_color = $yellow
  numlock_color = $yellow
  bothlock_color = $yellow
}


## Labels ##

# Time label
label {
  text = cmd[update:1] echo "<span>$(date +"%H:%M")</span>"
  color = $text
  font_size = 85
  font_family = $font Bold 
  position = 0, 75 
  halign = center
  valign = center
}
